<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мишка Раннер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; color: white; font-size: 22px; font-weight: bold; text-shadow: 0 2px 4px #000; }
        #withdraw-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: #ff9900; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 20px; font-weight: bold; display: none; box-shadow: 0 4px 15px rgba(255, 153, 0, 0.5); }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; text-align: center; color: white; display: none; border: 2px solid #ff9900; width: 80%; max-width: 300px; }
        button.restart { background: #ff9900; color: white; border: none; padding: 10px 20px; font-size: 18px; border-radius: 10px; margin-top: 15px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div id="hud">
        <div>🪙 <span id="wallet">0</span></div>
        <div>🏆 <span id="score">0</span></div>
    </div>
    <button id="withdraw-btn" onclick="requestWithdraw()">Вывести 15⭐</button>
    <canvas id="game"></canvas>
    <div id="game-over">
        <h2>Упс!</h2>
        <p>Собрано: <span id="final-score">0</span></p>
        <button class="restart" onclick="restartGame()">Играть снова</button>
    </div>

    <script>
        const BOT_USERNAME = "MishkaRunGame_bot"; 

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const groundY = canvas.height - 80;

        let audioCtx;
        function playSound(freq, type, duration) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        let wallet = parseInt(localStorage.getItem('bearWallet')) || 0;
        let score = 0;
        let gameOver = false;
        let gameSpeed = 7; 
        let frameCount = 0;
        const THRESHOLD = 1500; 
        
        let player = { x: 50, y: groundY - 40, w: 40, h: 40, vy: 0, gravity: 0.9, jumpForce: -15, isJumping: false };
        let obstacles = [];
        let coinObjects = [];

        function updateUI() {
            document.getElementById('wallet').innerText = wallet;
            document.getElementById('withdraw-btn').style.display = wallet >= THRESHOLD ? 'block' : 'none';
        }

        function jump() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!player.isJumping && !gameOver) {
                player.vy = player.jumpForce;
                player.isJumping = true;
                playSound(400, 'sine', 0.1);
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }
        document.body.addEventListener('touchstart', jump);

        function restartGame() {
            score = 0; gameSpeed = 7; frameCount = 0; obstacles = []; coinObjects = []; gameOver = false;
            player.y = groundY - 40; player.vy = 0; player.isJumping = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('score').innerText = score;
            update();
        }

        function update() {
            if (gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#222';
            ctx.fillRect(0, groundY, canvas.width, 80);

            player.vy += player.gravity;
            player.y += player.vy;
            if (player.y > groundY - player.h) {
                player.y = groundY - player.h; player.vy = 0; player.isJumping = false;
            }

            ctx.font = "40px Arial";
            ctx.fillText("🐻", player.x, player.y + 40);

            frameCount++;
            if (frameCount % 80 === 0 && Math.random() > 0.3) {
                obstacles.push({ x: canvas.width, y: groundY - 35, w: 25, h: 35 });
            }
            if (frameCount % 150 === 0 && Math.random() > 0.5) {
                coinObjects.push({ x: canvas.width, y: groundY - 90 - Math.random() * 40, r: 12 });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

                if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                    playSound(150, 'sawtooth', 0.3);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    gameOver = true;
                    document.getElementById('final-score').innerText = Math.floor(score);
                    document.getElementById('game-over').style.display = 'block';
                }
                if (obs.x < -50) obstacles.splice(i, 1);
            }

            for (let i = coinObjects.length - 1; i >= 0; i--) {
                let coin = coinObjects[i];
                coin.x -= gameSpeed;
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
                ctx.fillStyle = '#f1c40f'; ctx.fill();
                
                if (Math.hypot((player.x + 20) - coin.x, (player.y + 20) - coin.y) < 30) {
                    wallet++;
                    localStorage.setItem('bearWallet', wallet);
                    updateUI();
                    playSound(800, 'square', 0.1);
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                    coinObjects.splice(i, 1); continue;
                }
                if (coin.x < -50) coinObjects.splice(i, 1);
            }

            score += 0.1;
            document.getElementById('score').innerText = Math.floor(score);
            if (frameCount % 600 === 0) gameSpeed += 0.5;

            requestAnimationFrame(update);
        }

        function requestWithdraw() {
            if (wallet < THRESHOLD) return;
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            const tgUser = tg.initDataUnsafe?.user;
            if (tgUser) {
                const link = `https://t.me/${BOT_USERNAME}?start=withdraw_${tgUser.id}_${wallet}`;
                tg.openTelegramLink(link);
                wallet = 0; 
                localStorage.setItem('bearWallet', wallet);
                updateUI();
            }
        }

        updateUI();
        update();
    </script>
</body>
</html>
