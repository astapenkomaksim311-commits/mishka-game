<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mishka App 8.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; }

        #hud { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px; border: 1px solid #333; backdrop-filter: blur(5px); pointer-events: auto; }

        #menu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 20%, #1b2440, #0a0a0f 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        h1 { color: #3498db; font-size: 38px; margin: 0 0 5px 0; text-shadow: 0 0 25px rgba(52,152,219,0.7); }
        .tagline { color: #8aa; font-size: 14px; margin-bottom: 25px; }

        .btn { background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; padding: 15px; border-radius: 15px; font-size: 16px; font-weight: 900; margin: 5px; width: 90%; max-width: 300px; box-shadow: 0 4px 15px rgba(41, 128, 185, 0.4); transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .btn-gold { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #111; }
        .btn-row { display: flex; width: 90%; max-width: 300px; gap: 10px; margin-top: 5px; }
        .btn-row .btn { width: 100%; margin: 0; font-size: 14px; padding: 12px; }

        .modal { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a0f; display: none; flex-direction: column; align-items: center; padding: calc(60px + env(safe-area-inset-top)) 20px 20px; overflow-y: auto; z-index: 30; }
        .modal-header { font-size: 24px; font-weight: bold; margin-bottom: 20px; margin-top: 10px; }
        .close-modal { position: absolute; top: calc(15px + env(safe-area-inset-top)); right: 15px; background: #333; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; font-weight: bold; z-index: 31; }
        .card { background: #1a1a20; border: 1px solid #333; border-radius: 15px; padding: 15px; width: 100%; max-width: 350px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .card-btn { color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; }

        #toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(46,204,113,0.95); color: #000; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 14px; z-index: 50; display: none; white-space: nowrap; max-width: 90vw; }

        #crash-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #050505; display: none; flex-direction: column; z-index: 15; }
        #crash-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #crash-top { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 2; padding: 0 10px; }
        .hist-badge { background: #222; padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 14px; border: 1px solid #444; }
        #crash-multiplier { position: absolute; top: 15vh; width: 100%; text-align: center; font-size: 70px; font-weight: 900; color: #fff; text-shadow: 0 0 30px #f1c40f; z-index: 2; }
        #crash-controls { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; display: flex; flex-direction: column; z-index: 2; }
        .crash-input-box { display: flex; background: #1a1a20; border-radius: 15px; padding: 5px; border: 1px solid #333; margin-bottom: 10px; }
        .crash-input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 24px; font-weight: bold; text-align: center; outline: none; }
        .quick-bet { background: #333; color: white; border: none; border-radius: 10px; padding: 10px; font-weight: bold; margin-left: 5px; font-size: 12px; }
        .crash-action-btn { width: 100%; padding: 20px; border-radius: 15px; font-size: 20px; font-weight: 900; border: none; color: white; }
        .btn-start { background: #fff; color: #000; }
        .btn-cashout { background: #f1c40f; color: #000; }

        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 20, 25, 0.95); padding: 20px; border-radius: 20px; text-align: center; display: none; border: 2px solid #e74c3c; width: 90%; max-width: 320px; z-index: 40; }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-box">🪙 <span id="wallet">0</span></div>
        <div class="hud-box" onclick="topUpStars()" style="cursor:pointer; border-color:#f1c40f;">⭐ <span id="stars">0</span> <span style="font-size:12px; color:#f1c40f;">(+</span></div>
        <div class="hud-box" id="sound-btn" onclick="toggleSound()" style="cursor:pointer;">🔊</div>
    </div>

    <div id="menu">
        <h1>🐻 Mishka App</h1>
        <div class="tagline">Беги. Собирай. Побеждай.</div>
        <button class="btn" onclick="startRunner()">🏃‍♂️ Раннер</button>
        <button class="btn btn-red" onclick="openCrash()">🚀 Краш</button>
        <div class="btn-row">
            <button class="btn btn-gold" onclick="renderShop()">🛒 Скины</button>
            <button class="btn" style="background:#2a2a35;" onclick="renderCase()">📦 Кейс</button>
        </div>
        <div class="btn-row" style="margin-top: 10px;">
            <button class="btn" style="background: #8e44ad;" onclick="renderGifts()">🎁 Подарки</button>
        </div>
    </div>

    <div id="shop" class="modal">
        <button class="close-modal" onclick="closeModal('shop')">✕</button>
        <div class="modal-header" style="color: #f1c40f;">Скины</div>
        <div id="skins-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <div id="gifts-shop" class="modal">
        <button class="close-modal" onclick="closeModal('gifts-shop')">✕</button>
        <div class="modal-header" style="color: #e74c3c;">Подарки</div>
        <div id="gifts-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <div id="case-modal" class="modal">
        <button class="close-modal" onclick="closeModal('case-modal')">✕</button>
        <div class="modal-header" style="color: #f1c40f;">Кейс</div>
        <div id="case-timer" style="font-size:20px; margin:10px 0; font-weight:bold;">...</div>
        <div id="case-box" style="width: 120px; height: 120px; background: #222; border: 3px solid #f1c40f; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 70px; margin: 20px 0;">📦</div>
        <div id="case-result" style="font-size: 18px; font-weight: bold; color:#4cd137; height:30px;"></div>
        <button class="btn btn-gold" id="open-case-btn" onclick="doOpenCase()">Открыть</button>
    </div>

    <canvas id="game"></canvas>
    <div id="game-over">
        <h2 style="color:#e74c3c;">💥 Врезался!</h2>
        <p id="final-score" style="font-weight:bold; font-size:18px;"></p>
        <button class="btn btn-red" onclick="restartRunner()">Ещё раз</button>
        <button class="btn" style="background:#333;" onclick="exitRunner()">В меню</button>
    </div>

    <div id="crash-screen">
        <canvas id="crash-canvas"></canvas>
        <div id="crash-top"></div>
        <div id="crash-multiplier">1.00x</div>
        <div id="crash-controls">
            <div class="crash-input-box">
                <button class="quick-bet" onclick="setBet(10)">10</button>
                <button class="quick-bet" onclick="setBet(50)">50</button>
                <input type="number" id="crash-bet" value="1" min="1">
                <button class="quick-bet" onclick="setBet('max')">MAX</button>
            </div>
            <button class="btn-start crash-action-btn" id="crash-action-btn" onclick="crashAction()">Отправить ставку</button>
            <button class="btn" style="background:transparent; color:#555; margin-top:10px; box-shadow:none;" onclick="exitCrash()">Выйти</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const BOT_USERNAME = "MishkaRunGame_bot"; // <<< ИЗМЕНИ на юзернейм своего бота

        // ================== АУДИО-ДВИЖОК ==================
        let audioCtx = null;
        function getAudio() {
            if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playNote(freq, type, vol, dur, when) {
            const ctx = getAudio(); if (!ctx) return;
            const t = ctx.currentTime + (when || 0);
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur);
        }
        function sfx(type) {
            const ctx = getAudio(); if (!ctx || !sound.on) return;
            if (type === 'click') playNote(600, 'square', 0.12, 0.08);
            else if (type === 'jump') { playNote(320, 'sine', 0.18, 0.1); playNote(480, 'sine', 0.12, 0.1, 0.05); }
            else if (type === 'coin') { playNote(900, 'triangle', 0.18, 0.07); playNote(1300, 'triangle', 0.18, 0.1, 0.06); }
            else if (type === 'explosion') { playNote(120, 'sawtooth', 0.3, 0.4); playNote(80, 'square', 0.25, 0.5); }
            else if (type === 'cash') [523, 659, 784, 1046].forEach((f, i) => playNote(f, 'sine', 0.18, 0.15, i * 0.09));
            else if (type === 'tick') playNote(800, 'square', 0.06, 0.03);
            else if (type === 'lose') [400, 300, 220, 150].forEach((f, i) => playNote(f, 'sawtooth', 0.15, 0.2, i * 0.12));
        }
        function haptic(type) {
            try {
                if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
                else if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                else tg.HapticFeedback.notificationOccurred('success');
            } catch(e) {}
        }

        // ================== ФОНОВАЯ МУЗЫКА ==================
        // Мелодия генерируется кодом — никаких аудиофайлов не нужно.
        const CHORDS = [
            [220.00, 261.63, 329.63],  // Am
            [174.61, 220.00, 261.63],  // F
            [261.63, 329.63, 392.00],  // C
            [196.00, 246.94, 293.66],  // G
        ];
        const sound = { on: true };
        const music = { mode: null, timer: null, step: 0 };

        function musicTick() {
            const ctx = getAudio();
            if (!ctx || !sound.on || !music.mode || ctx.state !== 'running') return;
            const runner = music.mode === 'runner';
            const chord = CHORDS[Math.floor(music.step / 8) % 4];
            const arp = [chord[0], chord[1], chord[2], chord[1], chord[2], chord[0], chord[1], chord[2]];
            const note = arp[music.step % 8];
            playNote(note, runner ? 'triangle' : 'sine', runner ? 0.09 : 0.06, runner ? 0.22 : 0.5);
            if (runner) {
                if (music.step % 4 === 0) playNote(chord[0] / 2, 'square', 0.10, 0.18); // бас
                if (music.step % 4 === 2) playNote(chord[0] / 2 * 1.5, 'square', 0.07, 0.12);
                if (music.step % 8 === 0) playNote(90, 'sine', 0.18, 0.09); // "кик"
                if (music.step % 8 === 4) playNote(150, 'sine', 0.10, 0.05);
            } else {
                if (music.step % 8 === 0) playNote(chord[0] / 2, 'sine', 0.08, 1.6); // пэд
            }
            music.step++;
        }
        function setMusic(mode) {
            if (music.mode === mode) return;
            clearInterval(music.timer);
            music.mode = mode; music.step = 0;
            if (mode) {
                getAudio();
                const step = mode === 'runner' ? 145 : 220;
                music.timer = setInterval(musicTick, step);
            }
        }
        function toggleSound() {
            sound.on = !sound.on;
            document.getElementById('sound-btn').innerText = sound.on ? '🔊' : '🔇';
            state.musicOn = sound.on; saveState();
            if (!sound.on) clearInterval(music.timer); else if (music.mode) setMusic(music.mode);
        }
        // Музыка ставится на паузу, когда мини-апп сворачивают
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { clearInterval(music.timer); }
            else if (music.mode && sound.on) setMusic(music.mode);
        });
        // Разблокировка звука первым касанием
        document.body.addEventListener('touchstart', () => getAudio(), { once: true });
        document.body.addEventListener('mousedown', () => getAudio(), { once: true });

        // ================== ТОСТ ==================
        let toastTimer = null;
        function toast(text) {
            const t = document.getElementById('toast');
            t.innerText = text; t.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.style.display = 'none', 2500);
        }

        // ================== СОСТОЯНИЕ: ЧИСТЫЙ СТАРТ ДЛЯ ВСЕХ ==================
        // Новая версия хранилища, старые сейвы затираются — у всех нули.
        try { localStorage.removeItem('mishkaV7'); localStorage.removeItem('mishkaV8'); } catch(e) {}
        let state = null;
        try { state = JSON.parse(localStorage.getItem('mishkaV9')); } catch(e) {}
        if (!state) {
            state = { wallet: 0, stars: 0, ownedSkins: ['bear'], currentSkin: 'bear', lastCaseOpen: 0, ownedGifts: [], best: 0, musicOn: true };
            localStorage.setItem('mishkaV9', JSON.stringify(state));
        }
        if (state.best === undefined) state.best = 0;
        if (state.musicOn === undefined) state.musicOn = true;
        sound.on = state.musicOn;

        function saveState() { localStorage.setItem('mishkaV9', JSON.stringify(state)); updateHUD(); }
        function updateHUD() {
            document.getElementById('wallet').innerText = state.wallet;
            document.getElementById('stars').innerText = state.stars;
        }
        updateHUD();

        // ================== ПОЛУЧЕНИЕ КУПЛЕННОГО ПОСЛЕ ОПЛАТЫ ==================
        function applyStartParam() {
            const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
            if (!sp) return;
            if (sp.startsWith('topup_')) {
                const n = parseInt(sp.split('_')[1]) || 0;
                if (n > 0) { state.stars += n; saveState(); toast(`+${n} ⭐ зачислено!`); sfx('cash'); haptic('success'); }
            } else if (sp.startsWith('skin_')) {
                const id = sp.split('_')[1];
                if (!state.ownedSkins.includes(id)) {
                    state.ownedSkins.push(id); state.currentSkin = id; saveState();
                    toast('Скин куплен и надет! 🎉'); sfx('cash'); haptic('success');
                }
            }
            history.replaceState(null, '', location.pathname);
        }
        applyStartParam();

        function closeModal(id) { document.getElementById(id).style.display = 'none'; sfx('click'); }
        function topUpStars() { sfx('click'); tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=topup`); }

        // ================== МАГАЗИН СКИНОВ ==================
        const skinsData = [
            { id: 'bear', emoji: '🐻', name: 'Мишка', mult: 1, coins: 0, stars: 0 },
            { id: 'panda', emoji: '🐼', name: 'Панда', mult: 2, coins: 2000, stars: 0 },
            { id: 'boost5', emoji: '⚡', name: 'x5 (1 день)', mult: 5, coins: 0, stars: 30 }
        ];

        function renderShop() {
            sfx('click');
            const c = document.getElementById('skins-container'); c.innerHTML = '';
            skinsData.forEach(s => {
                const owned = state.ownedSkins.includes(s.id);
                const isEq = state.currentSkin === s.id;
                const btn = isEq ? 'Надет' : (owned ? 'Надеть' : 'Купить');
                const color = isEq ? '#4cd137' : (owned ? '#555' : '#3498db');
                const price = s.coins > 0 ? `🪙 ${s.coins}` : (s.stars > 0 ? `⭐ ${s.stars}` : '');
                c.innerHTML += `<div class="card">
                    <div style="font-size:30px;">${s.emoji}</div>
                    <div style="flex:1; text-align:left; padding-left:15px; font-weight:bold;">
                        ${s.name} (x${s.mult})<br><span style="color:#f1c40f; font-size:12px;">${owned ? '' : price}</span>
                    </div>
                    <button class="card-btn" style="background:${color};" onclick="buySkin('${s.id}')">${btn}</button>
                </div>`;
            });
            document.getElementById('shop').style.display = 'flex';
        }

        function buySkin(id) {
            sfx('click');
            const s = skinsData.find(x => x.id === id);
            if (state.ownedSkins.includes(id)) { state.currentSkin = id; saveState(); renderShop(); return; }
            if (s.coins > 0 && state.wallet >= s.coins) {
                state.wallet -= s.coins; state.ownedSkins.push(id); state.currentSkin = id;
                saveState(); renderShop(); toast('Куплено! 🎉'); sfx('cash');
            } else if (s.stars > 0) {
                tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=buy_${id}`);
            } else { tg.showAlert('Мало монет! Зарабатывай их в раннере 🏃'); haptic('heavy'); }
        }

        // ================== ПОДАРКИ ==================
        const giftsData = [
            { id: 'heart', emoji: '❤️', name: 'Сердечко', coins: 50000 },
            { id: 'gift', emoji: '🎁', name: 'Подарочек', coins: 75000 }
        ];

        function renderGifts() {
            sfx('click');
            const c = document.getElementById('gifts-container'); c.innerHTML = '';
            giftsData.forEach(g => {
                const owned = state.ownedGifts.includes(g.id);
                const btn = owned ? 'Вывести' : 'Купить';
                const color = owned ? '#f39c12' : '#8e44ad';
                c.innerHTML += `<div class="card">
                    <div style="font-size:30px;">${g.emoji}</div>
                    <div style="flex:1; text-align:left; padding-left:15px; font-weight:bold;">
                        ${g.name}<br><span style="color:#f1c40f; font-size:12px;">🪙 ${g.coins}</span>
                    </div>
                    <button class="card-btn" style="background:${color};" onclick="handleGift('${g.id}')">${btn}</button>
                </div>`;
            });
            document.getElementById('gifts-shop').style.display = 'flex';
        }

        function handleGift(id) {
            sfx('click');
            const g = giftsData.find(x => x.id === id);
            if (state.ownedGifts.includes(id)) {
                tg.sendData(JSON.stringify({ action: 'withdraw_gift', gift: g.name }));
                toast('Заявка отправлена! Проверь чат с ботом.');
                state.ownedGifts = state.ownedGifts.filter(x => x !== id);
                saveState(); renderGifts();
            } else {
                if (state.wallet >= g.coins) {
                    state.wallet -= g.coins; state.ownedGifts.push(id);
                    saveState(); renderGifts(); toast('Куплено! 🎉'); sfx('cash');
                } else { tg.showAlert('Мало монет! Зарабатывай их в раннере 🏃'); haptic('heavy'); }
            }
        }

        // ================== КЕЙС ==================
        let caseTimer = null;
        function renderCase() {
            sfx('click');
            document.getElementById('case-modal').style.display = 'flex';
            document.getElementById('case-result').innerText = '';
            clearInterval(caseTimer);
            const DAY = 86400000;
            const update = () => {
                const diff = Date.now() - state.lastCaseOpen;
                if (diff >= DAY) {
                    document.getElementById('open-case-btn').style.display = 'block';
                    document.getElementById('case-timer').innerText = '📦 Доступен!';
                    clearInterval(caseTimer);
                } else {
                    const left = DAY - diff;
                    const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), s = Math.floor(left % 60000 / 1000);
                    document.getElementById('open-case-btn').style.display = 'none';
                    document.getElementById('case-timer').innerText = `⏳ ${h}ч ${m}м ${s}с`;
                }
            };
            update();
            caseTimer = setInterval(update, 1000);
        }

        function doOpenCase() {
            state.lastCaseOpen = Date.now(); saveState();
            document.getElementById('open-case-btn').style.display = 'none';
            document.getElementById('case-result').innerText = '';
            let ticks = 0;
            const t = setInterval(() => {
                document.getElementById('case-box').innerText = ['🐻','🐼','⚡','🪙'][Math.floor(Math.random()*4)];
                sfx('tick');
                ticks++;
                if (ticks > 10) {
                    clearInterval(t);
                    const r = Math.random();
                    if (r < 0.80) { state.wallet += 250; document.getElementById('case-result').innerText = '🪙 +250 монет!'; }
                    else if (r < 0.95) { state.wallet += 500; document.getElementById('case-result').innerText = '🪙 +500 монет!'; }
                    else { state.stars += 25; document.getElementById('case-result').innerText = '⭐ +25 звёзд!'; }
                    saveState(); sfx('cash'); haptic('success');
                }
            }, 100);
        }

        // ================== РАННЕР ==================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let isRunner = false, rOver = false;
        let p = { x: 50, y: 0, vy: 0, g: 0.6, j: -11, jumps: 0 };
        let obs = [], coinsArr = [], particles = [], clouds = [];
        let bgFar = 0, bgMid = 0, bgNear = 0;
        let speed = 4.2, score = 0, lastObstacle = 0, lastCoin = 0;

        const GROUND_H = 60;
        const groundY = () => canvas.height - GROUND_H;
        const playerBase = () => groundY() - 42; // где стоит медведь (низ эмодзи)

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if (p.y > playerBase() || !isRunner) p.y = playerBase();
            clouds = [];
            for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * canvas.width, y: 40 + Math.random() * (canvas.height * 0.3), s: 0.2 + Math.random() * 0.3, w: 60 + Math.random() * 80 });
        }
        window.onresize = () => { resize(); if (document.getElementById('crash-screen').style.display !== 'none') resizeCrash(); };
        resize();

        // Звёзды на небе (генерируются один раз)
        let skyStars = [];
        function makeSkyStars() {
            skyStars = [];
            for (let i = 0; i < 60; i++) skyStars.push({ x: Math.random(), y: Math.random() * 0.5, r: Math.random() * 1.5 + 0.5, tw: Math.random() * Math.PI * 2 });
        }
        makeSkyStars();

        function spawnParticles(x, y, color, n) {
            for (let i = 0; i < (n || 8); i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 4 - 1, life: 1, color: color || '#f1c40f' });
            }
        }

        function resetRunner() {
            obs = []; coinsArr = []; particles = [];
            p.y = playerBase(); p.vy = 0; p.jumps = 0;
            speed = 4.2; score = 0; lastObstacle = 0; lastCoin = 0;
            rOver = false;
        }
        function startRunner() {
            sfx('click');
            document.getElementById('menu').style.display = 'none';
            isRunner = true; resetRunner();
            setMusic('runner');
            requestAnimationFrame(runnerLoop);
        }
        function exitRunner() {
            isRunner = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            setMusic('menu');
        }
        function restartRunner() {
            resetRunner();
            document.getElementById('game-over').style.display = 'none';
            setMusic('runner');
            requestAnimationFrame(runnerLoop);
        }

        // Красивый фон: закат + параллакс
        function drawSky(t) {
            const g = ctx.createLinearGradient(0, 0, 0, groundY());
            g.addColorStop(0, '#1a1a3e');
            g.addColorStop(0.55, '#3d2b56');
            g.addColorStop(0.85, '#8f4a5e');
            g.addColorStop(1, '#e0743c');
            ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, groundY());

            // Звёзды с мерцанием
            skyStars.forEach(s => {
                ctx.globalAlpha = 0.4 + Math.abs(Math.sin(t / 800 + s.tw)) * 0.6;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(s.x * canvas.width, s.y * groundY(), s.r, 0, 7); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Солнце у горизонта
            const sunX = canvas.width * 0.75, sunY = groundY() - 45;
            const glow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 90);
            glow.addColorStop(0, 'rgba(255,180,80,0.9)');
            glow.addColorStop(1, 'rgba(255,120,50,0)');
            ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sunX, sunY, 90, 0, 7); ctx.fill();
            ctx.fillStyle = '#ffd27d'; ctx.beginPath(); ctx.arc(sunX, sunY, 26, 0, 7); ctx.fill();

            // Облака (медленный параллакс)
            ctx.fillStyle = 'rgba(255,255,255,0.10)';
            clouds.forEach(c => {
                c.x -= c.s; if (c.x < -120) c.x = canvas.width + 100;
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w, c.w * 0.28, 0, 0, 7);
                ctx.ellipse(c.x + c.w * 0.5, c.y + 6, c.w * 0.6, c.w * 0.22, 0, 0, 7);
                ctx.fill();
            });
        }

        function drawMountains(offset, color, amp, base) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, groundY());
            for (let x = 0; x <= canvas.width + 40; x += 40) {
                const px = x + offset;
                const h = Math.sin(px * 0.004) * amp + Math.sin(px * 0.011) * amp * 0.4;
                ctx.lineTo(x, groundY() - base - h);
            }
            ctx.lineTo(canvas.width, groundY());
            ctx.closePath(); ctx.fill();
        }

        function drawTrees(offset) {
            ctx.fillStyle = '#10141f';
            const period = 140;
            const startI = Math.floor(offset / period);
            for (let i = startI; i < startI + Math.ceil(canvas.width / period) + 2; i++) {
                const seed = Math.abs(Math.sin(i * 127.1) * 43758.5) % 1;
                const x = i * period - offset + seed * 60;
                const h = 50 + seed * 50;
                ctx.beginPath();
                ctx.moveTo(x, groundY() + 2);
                ctx.lineTo(x - 16, groundY() + 2);
                ctx.lineTo(x - 8, groundY() - h);
                ctx.lineTo(x, groundY() + 2);
                ctx.moveTo(x, groundY() + 2);
                ctx.lineTo(x + 16, groundY() + 2);
                ctx.lineTo(x + 8, groundY() - h);
                ctx.lineTo(x, groundY() + 2);
                ctx.fill();
            }
        }

        function drawGround(offset) {
            ctx.fillStyle = '#151a10';
            ctx.fillRect(0, groundY(), canvas.width, GROUND_H);
            ctx.fillStyle = '#2a3a1c';
            ctx.fillRect(0, groundY(), canvas.width, 6);
            // Полосы травы, движущиеся с миром
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = -(offset % 60); x < canvas.width; x += 60) {
                ctx.moveTo(x, groundY() + 20); ctx.lineTo(x + 18, groundY() + 20);
                ctx.moveTo(x + 30, groundY() + 40); ctx.lineTo(x + 44, groundY() + 40);
            }
            ctx.stroke();
        }

        function runnerLoop() {
            if (!isRunner || rOver) return;
            const t = Date.now();

            drawSky(t);
            bgFar += speed * 0.15; bgMid += speed * 0.4; bgNear += speed * 0.75;
            drawMountains(bgFar, '#241d3a', 60, 90);
            drawMountains(bgMid, '#1a1630', 45, 45);
            drawTrees(bgNear);
            drawGround(bgNear);

            // Частицы
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx - speed * 0.5; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 0.03;
                if (pt.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = Math.max(pt.life, 0);
                ctx.fillStyle = pt.color;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, 7); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Игрок
            p.vy += p.g; p.y += p.vy;
            if (p.y > playerBase()) { p.y = playerBase(); p.vy = 0; p.jumps = 0; }
            ctx.font = '42px Arial'; ctx.textAlign = 'left';
            const skinEmoji = state.currentSkin === 'panda' ? '🐼' : (state.currentSkin === 'boost5' ? '⚡🐻' : '🐻');
            ctx.fillText(skinEmoji, p.x, p.y + 42);

            // Пыль под ногами при беге
            if (p.jumps === 0 && Math.random() < 0.3) {
                particles.push({ x: p.x + 5, y: p.y + 40, vx: -2, vy: -Math.random(), life: 0.5, color: 'rgba(120,120,120,0.5)' });
            }

            // Счёт и разгон
            score += speed * 0.05;
            speed = Math.min(speed + 0.0015, 7);
            ctx.font = 'bold 20px Arial'; ctx.fillStyle = '#fff';
            ctx.fillText('Счёт: ' + Math.floor(score) + '   Рекорд: ' + Math.floor(state.best), 10, 34);

            // Спавн препятствий с гарантированным зазором
            const canSpawn = !lastObstacle || t - lastObstacle > (900 - Math.min(speed, 7) * 60);
            if (canSpawn) {
                obs.push({ x: canvas.width, y: groundY() - 30, w: 30, h: 30, emoji: Math.random() > 0.5 ? '🌵' : '🪨' });
                lastObstacle = t;
            }
            const canCoin = !lastCoin || t - lastCoin > 1200;
            if (canCoin) {
                coinsArr.push({ x: canvas.width, y: groundY() - 90 - Math.random() * 70 });
                lastCoin = t;
            }

            // Препятствия
            for (let i = obs.length - 1; i >= 0; i--) {
                obs[i].x -= speed;
                ctx.font = '36px Arial';
                ctx.fillText(obs[i].emoji, obs[i].x, obs[i].y + 34);
                // Прощающие хитбоксы (запас 9px с каждой стороны)
                if (p.x + 9 < obs[i].x + obs[i].w && p.x + 30 - 9 > obs[i].x &&
                    p.y + 9 < obs[i].y + obs[i].h && p.y + 42 - 9 > obs[i].y) {
                    rOver = true;
                    sfx('explosion'); haptic('heavy');
                    if (score > state.best) { state.best = Math.floor(score); saveState(); }
                    document.getElementById('final-score').innerText = 'Счёт: ' + Math.floor(score) + '   Рекорд: ' + Math.floor(state.best);
                    document.getElementById('game-over').style.display = 'block';
                    setMusic(null); sfx('lose');
                    return;
                }
                if (obs[i].x < -60) obs.splice(i, 1);
            }

            // Монеты — БЕЗОПАСНОЕ удаление (здесь был баг зависания)
            for (let i = coinsArr.length - 1; i >= 0; i--) {
                coinsArr[i].x -= speed;
                ctx.font = '26px Arial';
                ctx.fillText('🪙', coinsArr[i].x, coinsArr[i].y);
                const dx = p.x + 20 - coinsArr[i].x - 12;
                const dy = p.y + 20 - coinsArr[i].y + 12;
                if (Math.hypot(dx, dy) < 38) {
                    const skin = skinsData.find(s => s.id === state.currentSkin);
                    const gain = 10 * (skin ? skin.mult : 1);
                    state.wallet += gain; saveState();
                    sfx('coin'); haptic('light');
                    spawnParticles(coinsArr[i].x, coinsArr[i].y, '#f1c40f', 10);
                    coinsArr.splice(i, 1);
                    continue; // важно: после удаления сразу идём дальше
                }
                if (coinsArr[i] && coinsArr[i].x < -40) coinsArr.splice(i, 1);
            }

            requestAnimationFrame(runnerLoop);
        }

        // Прыжок (двойной) — тап или клик, но не по кнопкам интерфейса
        function tryJump(e) {
            if (isRunner && !rOver && p.jumps < 2) {
                p.vy = p.jumps === 0 ? p.j : p.j * 0.85;
                p.jumps++;
                sfx('jump'); haptic('light');
            }
        }
        document.body.addEventListener('touchstart', (e) => {
            if (e.target.closest('button') || e.target.closest('.hud-box')) return;
            tryJump(e);
        });
        document.body.addEventListener('mousedown', (e) => {
            if (e.target.closest('button') || e.target.closest('.hud-box')) return;
            tryJump(e);
        });

        // ================== КРАШ (чистый, без фейковых игроков) ==================
        const cCanvas = document.getElementById('crash-canvas');
        const cCtx = cCanvas.getContext('2d');
        let cActive = false, cMult = 1.0, cRocket = { x: 50, y: 0 }, cTimer = null, cHistory = [];

        function drawCrashHistory() {
            document.getElementById('crash-top').innerHTML = cHistory.slice(-4).map(m =>
                `<div class="hist-badge" style="color:${m < 2 ? '#e74c3c' : '#2ecc71'};">x${m.toFixed(2)}</div>`
            ).join('');
        }
        cHistory = [1.21, 3.05, 1.08, 7.22].sort(() => Math.random() - 0.5);
        drawCrashHistory();

        function openCrash() {
            sfx('click');
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crash-screen').style.display = 'flex';
            resizeCrash();
            document.getElementById('crash-multiplier').innerText = '1.00x';
            document.getElementById('crash-multiplier').style.color = '#fff';
        }
        function resizeCrash() {
            cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight;
            cCtx.fillStyle = '#050505'; cCtx.fillRect(0, 0, cCanvas.width, cCanvas.height);
            cRocket = { x: 50, y: cCanvas.height - 100 };
        }

        function exitCrash() {
            if (cActive) { tg.showAlert('Сначала забери выигрыш или дождись краша!'); return; }
            document.getElementById('crash-screen').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            sfx('click');
        }
        function setBet(val) {
            sfx('click');
            document.getElementById('crash-bet').value = (val === 'max') ? state.stars : val;
        }

        function crashAction() {
            const btn = document.getElementById('crash-action-btn');
            const bet = parseInt(document.getElementById('crash-bet').value) || 0;

            if (!cActive) {
                if (bet < 1) { tg.showAlert('Минимальная ставка — 1 звезда!'); return; }
                if (state.stars < bet) { tg.showAlert('Мало звёзд! Пополни баланс по кнопке ⭐.'); haptic('heavy'); return; }
                state.stars -= bet; saveState();

                cActive = true; cMult = 1.0;
                cRocket = { x: 50, y: cCanvas.height - 100 };
                btn.innerText = `Забрать (${bet} ⭐)`;
                btn.className = 'crash-action-btn btn-cashout';

                const r = Math.random();
                const crashPoint = r < 0.35 ? 1.0 + Math.random() * 0.3 : r < 0.8 ? 1.3 + Math.random() * 1.5 : 2.8 + Math.random() * 7;
                const startTime = Date.now();

                cTimer = setInterval(() => {
                    const time = (Date.now() - startTime) / 1000;
                    cMult = Math.pow(1.15, time);

                    if (cMult >= crashPoint) {
                        clearInterval(cTimer); cActive = false;
                        const mm = document.getElementById('crash-multiplier');
                        mm.innerText = 'ВЗРЫВ 💥 x' + crashPoint.toFixed(2); mm.style.color = '#e74c3c';
                        btn.innerText = 'Отправить ставку'; btn.className = 'crash-action-btn btn-start';
                        sfx('explosion'); haptic('heavy');
                        cHistory.push(crashPoint); drawCrashHistory();
                        tg.sendData(JSON.stringify({ action: 'crash_lose', bet: bet }));
                        return;
                    }

                    cCtx.fillStyle = '#050505'; cCtx.fillRect(0, 0, cCanvas.width, cCanvas.height);
                    cCtx.fillStyle = 'white';
                    for (let i = 0; i < 30; i++) {
                        cCtx.globalAlpha = Math.random();
                        cCtx.fillRect(Math.random() * cCanvas.width, Math.random() * cCanvas.height, 2, 2);
                    }
                    cCtx.globalAlpha = 1;

                    cRocket.x = Math.min(cRocket.x + 3, cCanvas.width - 60);
                    cRocket.y = Math.max(cRocket.y - 2, 80);
                    cCtx.font = '50px Arial'; cCtx.fillStyle = '#fff';
                    cCtx.fillText('🚀', cRocket.x, cRocket.y);
                    cCtx.strokeStyle = '#f1c40f'; cCtx.lineWidth = 3;
                    cCtx.beginPath(); cCtx.moveTo(50, cCanvas.height - 100); cCtx.lineTo(cRocket.x, cRocket.y); cCtx.stroke();

                    document.getElementById('crash-multiplier').innerText = cMult.toFixed(2) + 'x';
                    document.getElementById('crash-multiplier').style.color = '#fff';
                    btn.innerText = `Забрать (${Math.floor(bet * cMult)} ⭐)`;
                }, 100);
            } else {
                clearInterval(cTimer); cActive = false;
                const win = Math.floor(bet * cMult);
                state.stars += win; saveState();
                const mm = document.getElementById('crash-multiplier');
                mm.innerText = `+${win} ⭐ (x${cMult.toFixed(2)})`; mm.style.color = '#2ecc71';
                btn.innerText = 'Отправить ставку'; btn.className = 'crash-action-btn btn-start';
                sfx('cash'); haptic('success');
                cHistory.push(cMult); drawCrashHistory();
            }
        }

        // ================== СТАРТ ==================
        if (sound.on) document.getElementById('sound-btn').innerText = '🔊';
        else document.getElementById('sound-btn').innerText = '🔇';
        // Меню играет музыку сразу, как только звук разблокирован касанием
        const musicKick = () => { if (!music.mode) setMusic('menu'); };
        document.body.addEventListener('touchstart', musicKick, { once: true });
        document.body.addEventListener('mousedown', musicKick, { once: true });
    </script>
</body>
</html>
