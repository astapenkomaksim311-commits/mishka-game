<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мишка Раннер 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: white; font-size: 22px; font-weight: 900; text-shadow: 2px 2px 0 #000; z-index: 10; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 15, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        #menu h1 { color: #ff9900; font-size: 42px; margin: 0 0 10px 0; text-shadow: 0 0 20px rgba(255,153,0,0.6); }
        #menu p { color: #aaa; margin-bottom: 30px; font-size: 16px; }
        .btn-main { background: linear-gradient(135deg, #ff9900, #ff5500); color: white; border: none; padding: 18px 60px; border-radius: 40px; font-size: 24px; font-weight: 900; box-shadow: 0 6px 20px rgba(255, 85, 0, 0.5); margin-bottom: 20px; width: 250px; transition: transform 0.1s; }
        .btn-main:active { transform: scale(0.95); }
        .btn-secondary { background: #2a2a35; color: white; border: 2px solid #444; padding: 12px 25px; border-radius: 25px; font-size: 16px; font-weight: bold; margin: 5px; width: 120px; }
        .btn-secondary:active { background: #444; }

        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 20, 25, 0.95); padding: 30px; border-radius: 25px; text-align: center; color: white; display: none; border: 2px solid #ff5500; width: 80%; max-width: 320px; z-index: 15; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #game-over h2 { color: #ff5500; margin-top: 0; font-size: 28px; }
        .btn-restart { background: #ff9900; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 15px; margin-top: 15px; font-weight: bold; width: 100%; }
        .btn-menu { background: #333; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 15px; margin-top: 10px; font-weight: bold; width: 100%; }

        #shop { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 15, 20, 0.98); display: none; flex-direction: column; align-items: center; z-index: 30; padding-top: 20px; overflow-y: auto; }
        .shop-header { color: white; font-size: 28px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px #ff9900; }
        .skin-card { background: #222; border: 2px solid #333; border-radius: 15px; padding: 15px; width: 85%; max-width: 350px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .skin-info { display: flex; flex-direction: column; color: white; text-align: left; }
        .skin-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .skin-mult { color: #4cd137; font-size: 14px; font-weight: bold; }
        .skin-price { color: #f1c40f; font-size: 14px; margin-top: 5px; }
        .skin-buy-btn { background: #ff9900; border: none; border-radius: 10px; padding: 10px 15px; font-weight: bold; color: white; }
        .skin-buy-btn:active { background: #cc7a00; }
        .skin-buy-btn.equipped { background: #4cd137; }
        .skin-buy-btn.owned { background: #555; color: #aaa; }
        .btn-close-shop { background: #e74c3c; color: white; border: none; padding: 12px 40px; border-radius: 20px; font-size: 18px; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="hud">
        <div>🪙 <span id="wallet">0</span> <span id="mult-text" style="color:#4cd137; font-size:14px; margin-left:5px;"></span></div>
        <div>🏆 <span id="score">0</span></div>
    </div>

    <div id="menu">
        <h1>🐻 Мишка 2.0</h1>
        <p>Беги, собирай монеты, покупай скины!</p>
        <button class="btn-main" onclick="startGame()">ИГРАТЬ</button>
        <div style="display: flex;">
            <button class="btn-secondary" onclick="toggleSound()" id="sound-btn">🔊 Звук</button>
            <button class="btn-secondary" onclick="openShop()">🛒 Магазин</button>
        </div>
    </div>

    <div id="shop">
        <div class="shop-header">Магазин Скинов</div>
        <div id="skins-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
        <button class="btn-close-shop" onclick="closeShop()">Закрыть</button>
    </div>

    <canvas id="game"></canvas>
    
    <div id="game-over">
        <h2>БУМ! 💥</h2>
        <p>Собрано: <span id="final-score">0</span></p>
        <button class="btn-restart" onclick="restartGame()">Играть снова</button>
        <button class="btn-menu" onclick="showMenu()">В меню</button>
    </div>

    <script>
        const BOT_USERNAME = "MishkaRunGame_bot"; 
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let soundEnabled = true;
        let audioCtx;
        let musicInterval;
        const bgMusicNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; 
        let noteIdx = 0;

        function playSound(freq, type, duration, vol = 0.1) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function toggleMusic(start) {
            if (start && soundEnabled) {
                if (musicInterval) clearInterval(musicInterval);
                musicInterval = setInterval(() => {
                    if (!gameOver && isPlaying) {
                        playSound(bgMusicNotes[noteIdx], 'triangle', 0.3, 0.05);
                        noteIdx = (noteIdx + 1) % bgMusicNotes.length;
                    }
                }, 250);
            } else {
                clearInterval(musicInterval);
            }
        }

        const skinsData = [
            { id: 'bear', emoji: '🐻', name: 'Обычный', multiplier: 1, priceCoins: 0, priceStars: 0 },
            { id: 'ninja', emoji: '🥷', name: 'Ниндзя', multiplier: 2, priceCoins: 3000, priceStars: 0 },
            { id: 'robot', emoji: '🤖', name: 'Робот', multiplier: 3, priceCoins: 10000, priceStars: 0 },
            { id: 'king', emoji: '👑', name: 'Золотой', multiplier: 5, priceCoins: 0, priceStars: 50 }
        ];

        let wallet = parseInt(localStorage.getItem('bearWallet')) || 0;
        let ownedSkins = JSON.parse(localStorage.getItem('ownedSkins')) || ['bear'];
        let currentSkinId = localStorage.getItem('currentSkin') || 'bear';

        function getCurrentSkin() { return skinsData.find(s => s.id === currentSkinId); }

        function updateHUD() {
            document.getElementById('wallet').innerText = wallet;
            document.getElementById('mult-text').innerText = currentSkinId !== 'bear' ? `(x${getCurrentSkin().multiplier})` : '';
        }

        let isPlaying = false;
        let gameOver = false;
        let score = 0;
        let gameSpeed = 7;
        let frameCount = 0;
        let particles = [];
        let floatingTexts = [];
        
        let groundY = canvas.height - 80;
        let player = { x: 60, y: groundY - 40, w: 40, h: 40, vy: 0, gravity: 0.9, jumpForce: -16, isJumping: false };
        let obstacles = [];
        let coinObjects = [];
        let bgOffset = 0;
        let hueOffset = 0;

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            isPlaying = true;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            toggleMusic(true);
            restartGame();
        }

        function showMenu() {
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            isPlaying = false;
            toggleMusic(false);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function jump() {
            if (!player.isJumping && !gameOver && isPlaying) {
                player.vy = player.jumpForce;
                player.isJumping = true;
                playSound(500, 'sine', 0.1, 0.15);
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }
        document.body.addEventListener('touchstart', jump);

        function restartGame() {
            score = 0; gameSpeed = 7; frameCount = 0; obstacles = []; coinObjects = []; particles = []; floatingTexts = []; gameOver = false;
            player.y = groundY - 40; player.vy = 0; player.isJumping = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('score').innerText = score;
            updateHUD();
            update();
        }

        function createParticles(x, y) {
            for(let i=0; i<6; i++) {
                particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 1 });
            }
        }

        function update() {
            if (gameOver || !isPlaying) return;
            
            // --- СВЕТЛЫЙ ДИНАМИЧЕСКИЙ ФОН ---
            hueOffset += 0.2;
            let bgColorTop = `hsl(${200 + Math.sin(hueOffset/100)*20}, 70%, 60%)`; // Голубой/закатный
            let bgColorBottom = `hsl(${300 + Math.cos(hueOffset/100)*20}, 60%, 40%)`; // Розоватый/фиолетовый
            
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, bgColorTop);
            grad.addColorStop(1, bgColorBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Облака (параллакс)
            bgOffset -= 1;
            if(bgOffset < -300) bgOffset = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath(); ctx.arc(bgOffset, 80, 30, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bgOffset+40, 90, 25, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bgOffset+250, 120, 40, 0, Math.PI*2); ctx.fill();

            // Земля
            ctx.fillStyle = '#2d2d35'; 
            ctx.fillRect(0, groundY, canvas.width, 80);
            ctx.fillStyle = '#ffaa00'; 
            ctx.fillRect(0, groundY, canvas.width, 5);

            player.vy += player.gravity; 
            player.y += player.vy;
            if (player.y > groundY - player.h) { 
                player.y = groundY - player.h; player.vy = 0; player.isJumping = false; 
            }

            // Мишка
            ctx.font = "45px Arial"; 
            ctx.fillText(getCurrentSkin().emoji, player.x, player.y + 40);

            // Частицы
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if(p.life <= 0) { particles.splice(i,1); continue; }
                ctx.fillStyle = `rgba(255, 215, 0, ${p.life})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
            }

            // Всплывающий текст (+1)
            for(let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1.5; ft.life -= 0.02;
                if(ft.life <= 0) { floatingTexts.splice(i,1); continue; }
                ctx.fillStyle = `rgba(255, 255, 255, ${ft.life})`;
                ctx.font = "bold 20px Arial";
                ctx.fillText(ft.text, ft.x, ft.y);
            }

            frameCount++;
            if (frameCount % 80 === 0 && Math.random() > 0.4) {
                obstacles.push({ x: canvas.width, y: groundY - 35, w: 30, h: 40, type: Math.random() > 0.5 ? '🌵' : '🪨' });
            }
            if (frameCount % 120 === 0 && Math.random() > 0.3) {
                let amount = Math.random() > 0.85 ? 5 : 1; 
                coinObjects.push({ x: canvas.width, y: groundY - 100 - Math.random() * 60, r: 12, amount: amount });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.x -= gameSpeed;
                ctx.font = "40px Arial"; 
                ctx.fillText(obs.type, obs.x, obs.y + 40);

                if (player.x + 10 < obs.x + obs.w && player.x + player.w - 10 > obs.x &&
                    player.y + 10 < obs.y + obs.h && player.y + player.h - 5 > obs.y) {
                    playSound(150, 'sawtooth', 0.5, 0.2);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    gameOver = true; toggleMusic(false);
                    document.getElementById('final-score').innerText = Math.floor(score);
                    document.getElementById('game-over').style.display = 'block';
                }
                if (obs.x < -50) obstacles.splice(i, 1);
            }

            for (let i = coinObjects.length - 1; i >= 0; i--) {
                let coin = coinObjects[i]; coin.x -= gameSpeed;
                ctx.font = "25px Arial"; 
                ctx.fillText("🪙", coin.x - 10, coin.y + 10);
                
                if (Math.hypot((player.x + 20) - coin.x, (player.y + 20) - coin.y) < 35) {
                    let earned = coin.amount * getCurrentSkin().multiplier;
                    wallet += earned;
                    localStorage.setItem('bearWallet', wallet);
                    updateHUD();
                    playSound(1200, 'square', 0.1, 0.1);
                    createParticles(coin.x, coin.y);
                    
                    // Добавляем текст +1 или +5
                    floatingTexts.push({ x: coin.x, y: coin.y - 10, text: `+${earned}`, life: 1 });
                    
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                    coinObjects.splice(i, 1); continue;
                }
                if (coin.x < -50) coinObjects.splice(i, 1);
            }

            score += 0.1; 
            document.getElementById('score').innerText = Math.floor(score);
            if (frameCount % 600 === 0) gameSpeed += 0.5;

            requestAnimationFrame(update);
        }

        // --- МАГАЗИН ---
        function openShop() {
            renderShop();
            document.getElementById('shop').style.display = 'flex';
        }

        function closeShop() {
            document.getElementById('shop').style.display = 'none';
        }

        function renderShop() {
            const container = document.getElementById('skins-container');
            container.innerHTML = '';
            
            skinsData.forEach(skin => {
                let isOwned = ownedSkins.includes(skin.id);
                let isEquipped = currentSkinId === skin.id;
                
                let btnText = isEquipped ? 'Надет' : (isOwned ? 'Надеть' : 'Купить');
                let btnClass = isEquipped ? 'equipped' : (isOwned ? 'owned' : '');
                
                let priceText = '';
                if (!isOwned) {
                    if (skin.priceCoins > 0) priceText = `🪙 ${skin.priceCoins}`;
                    if (skin.priceStars > 0) priceText = `⭐ ${skin.priceStars}`;
                }

                let card = document.createElement('div');
                card.className = 'skin-card';
                card.innerHTML = `
                    <div style="font-size: 40px; background: #111; padding: 10px; border-radius: 10px;">${skin.emoji}</div>
                    <div class="skin-info">
                        <div class="skin-name">${skin.name}</div>
                        <div class="skin-mult">Бонус: x${skin.multiplier} монет</div>
                        <div class="skin-price">${priceText}</div>
                    </div>
                    <button class="skin-buy-btn ${btnClass}" onclick="buyOrEquip('${skin.id}')">${btnText}</button>
                `;
                container.appendChild(card);
            });
        }

        function buyOrEquip(skinId) {
            const skin = skinsData.find(s => s.id === skinId);
            let isOwned = ownedSkins.includes(skin.id);

            if (currentSkinId === skinId) return;

            if (isOwned) {
                currentSkinId = skinId;
                localStorage.setItem('currentSkin', currentSkinId);
                playSound(600, 'sine', 0.2);
                renderShop();
                updateHUD();
            } else {
                if (skin.priceCoins > 0 && wallet >= skin.priceCoins) {
                    // Покупка за монеты
                    wallet -= skin.priceCoins;
                    ownedSkins.push(skin.id);
                    currentSkinId = skin.id;
                    saveShopData();
                    playSound(800, 'square', 0.3, 0.1);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    renderShop();
                    updateHUD();
                } else if (skin.priceStars > 0) {
                    // Покупка за звезды
                    tg.showConfirm(`Купить ${skin.name} за ${skin.priceStars} Stars?`, (ok) => {
                        if(ok) {
                            // Отправляем боту команду на выставление счета
                            tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=buy_skin_${skin.id}`);
                            closeShop(); 
                        }
                    });
                } else {
                    tg.showAlert("Недостаточно монет! Беги и собирай ещё!");
                    playSound(200, 'sawtooth', 0.2);
                }
            }
        }

        function saveShopData() {
            localStorage.setItem('bearWallet', wallet);
            localStorage.setItem('ownedSkins', JSON.stringify(ownedSkins));
            localStorage.setItem('currentSkin', currentSkinId);
        }

        updateHUD();
    </script>
</body>
</html>
