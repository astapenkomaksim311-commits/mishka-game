<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мишка Раннер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; color: white; font-size: 22px; font-weight: bold; text-shadow: 0 2px 4px #000; z-index: 10; }
        #menu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(17, 17, 17, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        #menu h1 { color: #ff9900; font-size: 36px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,153,0,0.5); }
        #menu p { color: #aaa; margin-bottom: 30px; }
        .btn-main { background: #ff9900; color: white; border: none; padding: 15px 50px; border-radius: 30px; font-size: 24px; font-weight: bold; box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4); margin-bottom: 15px; width: 200px; }
        .btn-secondary { background: #333; color: white; border: 2px solid #555; padding: 12px 30px; border-radius: 20px; font-size: 18px; font-weight: bold; margin: 5px; width: 150px; }
        #withdraw-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: #ff9900; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 20px; font-weight: bold; display: none; box-shadow: 0 4px 15px rgba(255, 153, 0, 0.5); z-index: 10; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 25px; border-radius: 20px; text-align: center; color: white; display: none; border: 2px solid #ff9900; width: 80%; max-width: 300px; z-index: 15; }
        #game-over h2 { color: #ff9900; margin-top: 0; }
        .btn-restart { background: #ff9900; color: white; border: none; padding: 12px 25px; font-size: 18px; border-radius: 12px; margin-top: 15px; font-weight: bold; width: 100%; }
        #shop-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; padding: 20px; border-radius: 15px; text-align: center; color: white; display: none; border: 2px solid #ff9900; width: 80%; max-width: 300px; z-index: 30; }
        #shop-modal button { background: #ff9900; color: white; border: none; padding: 10px 20px; border-radius: 10px; margin-top: 15px; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
    <div id="hud">
        <div>🪙 <span id="wallet">0</span></div>
        <div>🏆 <span id="score">0</span></div>
    </div>

    <div id="menu">
        <h1>Мишка Раннер 🐻</h1>
        <p>Беги, прыгай, собирай монеты!</p>
        <button class="btn-main" onclick="startGame()">Играть</button>
        <div style="display: flex;">
            <button class="btn-secondary" onclick="toggleSound()" id="sound-btn">🔊 Звук</button>
            <button class="btn-secondary" onclick="openShop()">🛒 Магазин</button>
        </div>
    </div>

    <div id="shop-modal">
        <h2>Магазин 🛒</h2>
        <p>Здесь скоро можно будет купить крутые скины для мишки и бонусы за монеты!</p>
        <button onclick="closeShop()">Закрыть</button>
    </div>

    <button id="withdraw-btn" onclick="requestWithdraw()">Вывести 15⭐</button>
    <canvas id="game"></canvas>
    
    <div id="game-over">
        <h2>Упс!</h2>
        <p>Собрано: <span id="final-score">0</span></p>
        <button class="btn-restart" onclick="showMenu()">В меню</button>
        <button class="btn-restart" style="margin-top: 5px; background: #444;" onclick="restartGame()">Играть снова</button>
    </div>

    <script>
        const BOT_USERNAME = "MishkaRunGame_bot"; 
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const groundY = canvas.height - 80;

        let soundEnabled = true;
        let isPlaying = false; 
        let audioCtx;
        let musicInterval;

        // Фоновая музыка (простая мелодия)
        const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // Ноты
        let noteIndex = 0;

        function playSound(freq, type, duration) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function toggleMusic(start) {
            if (start && soundEnabled) {
                if (musicInterval) clearInterval(musicInterval);
                musicInterval = setInterval(() => {
                    if (isPlaying && !gameOver) {
                        playSound(melody[noteIndex], 'triangle', 0.2);
                        noteIndex = (noteIndex + 1) % melody.length;
                    }
                }, 300); // Скорость мелодии
            } else {
                clearInterval(musicInterval);
            }
        }

        let wallet = parseInt(localStorage.getItem('bearWallet')) || 0;
        let score = 0;
        let gameOver = false;
        let gameSpeed = 7; 
        let frameCount = 0;
        const THRESHOLD = 1500; 
        
        let player = { x: 50, y: groundY - 40, w: 40, h: 40, vy: 0, gravity: 0.9, jumpForce: -15, isJumping: false };
        let obstacles = [];
        let coinObjects = [];

        function updateUI() {
            document.getElementById('wallet').innerText = wallet;
            if (wallet >= THRESHOLD) {
                document.getElementById('withdraw-btn').style.display = isPlaying ? 'block' : 'none';
            } else {
                document.getElementById('withdraw-btn').style.display = 'none';
            }
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            isPlaying = true;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            toggleMusic(true);
            restartGame();
        }

        function showMenu() {
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            isPlaying = false;
            toggleMusic(false);
            updateUI();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? "🔊 Звук" : "🔇 Без звука";
            if (!soundEnabled) toggleMusic(false);
            else if (isPlaying) toggleMusic(true);
        }

        function openShop() { document.getElementById('shop-modal').style.display = 'block'; }
        function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

        function jump() {
            if (!player.isJumping && !gameOver && isPlaying) {
                player.vy = player.jumpForce;
                player.isJumping = true;
                playSound(400, 'sine', 0.1);
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }
        document.body.addEventListener('touchstart', jump);

        function restartGame() {
            score = 0; gameSpeed = 7; frameCount = 0; obstacles = []; coinObjects = []; gameOver = false;
            player.y = groundY - 40; player.vy = 0; player.isJumping = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('score').innerText = score;
            updateUI();
            update();
        }

        function update() {
            if (gameOver || !isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#222'; ctx.fillRect(0, groundY, canvas.width, 80);
            player.vy += player.gravity; player.y += player.vy;
            if (player.y > groundY - player.h) { player.y = groundY - player.h; player.vy = 0; player.isJumping = false; }
            ctx.font = "40px Arial"; ctx.fillText("🐻", player.x, player.y + 40);
            frameCount++;
            if (frameCount % 80 === 0 && Math.random() > 0.3) obstacles.push({ x: canvas.width, y: groundY - 35, w: 25, h: 35 });
            if (frameCount % 150 === 0 && Math.random() > 0.5) coinObjects.push({ x: canvas.width, y: groundY - 90 - Math.random() * 40, r: 12 });

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.x -= gameSpeed;
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                if (player.x < obs.x + obs.w && player.x + player.w > obs.x && player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                    playSound(150, 'sawtooth', 0.3);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    gameOver = true; toggleMusic(false);
                    document.getElementById('final-score').innerText = Math.floor(score);
                    document.getElementById('game-over').style.display = 'block';
                }
                if (obs.x < -50) obstacles.splice(i, 1);
            }

            for (let i = coinObjects.length - 1; i >= 0; i--) {
                let coin = coinObjects[i]; coin.x -= gameSpeed;
                ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
                ctx.fillStyle = '#f1c40f'; ctx.fill();
                if (Math.hypot((player.x + 20) - coin.x, (player.y + 20) - coin.y) < 30) {
                    wallet++; localStorage.setItem('bearWallet', wallet); updateUI();
                    playSound(800, 'square', 0.1);
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                    coinObjects.splice(i, 1); continue;
                }
                if (coin.x < -50) coinObjects.splice(i, 1);
            }

            score += 0.1; document.getElementById('score').innerText = Math.floor(score);
            if (frameCount % 600 === 0) gameSpeed += 0.5;
            requestAnimationFrame(update);
        }

        // ОТПРАВКА ЗАЯВКИ НА ВЫВОД
        function requestWithdraw() {
            if (wallet < THRESHOLD) return;
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            const tgUser = tg.initDataUnsafe?.user;
            if (tgUser) {
                // Формируем ссылку: start=w_ID_МОНЕТЫ
                const link = `https://t.me/${BOT_USERNAME}?start=w_${tgUser.id}_${wallet}`;
                tg.openTelegramLink(link);
                wallet = 0; 
                localStorage.setItem('bearWallet', wallet);
                updateUI();
            }
        }

        ctx.fillStyle = '#222'; ctx.fillRect(0, groundY, canvas.width, 80);
    </script>
</body>
</html>
